    resources: ["services"]
    resourceNames: ["api-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api-gateway"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["api-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    resourceNames: ["api-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-api-gateway-app
  labels:
    app.kubernetes.io/part-of: code-keeper
subjects:
  - kind: Group
    name: code-keeper-deploy-api-gateway-app
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deploy-api-gateway-app
  apiGroup: rbac.authorization.k8s.io
