# Creates or updates one CI/CD variable of a group or a project.
#   ci_variable_scope  groups | projects
#   ci_variable_owner  ID of the group or project
#   ci_variable        {key, value, description}
# Every variable is protected (only jobs of protected branches receive it) and
# raw (no expansion). The AWS access comes from OIDC, so the only secret is the
# Renovate token, declared with masked: true (hidden in job logs, and in the
# output of this playbook).
- name: Look up the variable {{ ci_variable.key }}
  ansible.builtin.uri:
    url: "{{ gitlab_api_url }}/{{ ci_variable_scope }}/{{ ci_variable_owner }}/variables/{{ ci_variable.key }}"
    headers:
      PRIVATE-TOKEN: "{{ vault_gitlab_api_token }}"
    ca_path: "{{ pki_ca_cert }}"
    status_code: [200, 404]
  register: gitlab_ci_variable_current
  no_log: "{{ ci_variable.masked | default(false) }}"

- name: Create the variable {{ ci_variable.key }}
  ansible.builtin.uri:
    url: "{{ gitlab_api_url }}/{{ ci_variable_scope }}/{{ ci_variable_owner }}/variables"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ vault_gitlab_api_token }}"
    ca_path: "{{ pki_ca_cert }}"
    body_format: json
    body: "{{ gitlab_ci_variable_flags | combine(ci_variable) }}"
    status_code: 201
  when: gitlab_ci_variable_current.status == 404
  changed_when: true
  no_log: "{{ ci_variable.masked | default(false) }}"

- name: Update the variable {{ ci_variable.key }}
  ansible.builtin.uri:
    url: "{{ gitlab_api_url }}/{{ ci_variable_scope }}/{{ ci_variable_owner }}/variables/{{ ci_variable.key }}"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ vault_gitlab_api_token }}"
    ca_path: "{{ pki_ca_cert }}"
    body_format: json
    body: "{{ gitlab_ci_variable_flags | combine(ci_variable) }}"
  when:
    - gitlab_ci_variable_current.status == 200
    - >-
      (gitlab_ci_variable_flags | combine(ci_variable) | dict2items)
      | difference(gitlab_ci_variable_current.json | dict2items) | length > 0
  changed_when: true
  no_log: "{{ ci_variable.masked | default(false) }}"
