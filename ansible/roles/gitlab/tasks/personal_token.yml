# Creates or renews a personal access token whose value comes from the vault.
#   personal_token_user    account owning the token
#   personal_token_name    name of the token in GitLab
#   personal_token_scopes  list of scopes
#   personal_token_days    lifetime in days
#   personal_token_value   value from the vault (exactly 20 characters)
# The token is recreated whenever GitLab refuses it (expired or revoked) or
# answers for another account.
- name: Check the token {{ personal_token_name }} of {{ personal_token_user }}
  ansible.builtin.uri:
    url: "{{ gitlab_api_url }}/user"
    headers:
      PRIVATE-TOKEN: "{{ personal_token_value }}"
    ca_path: "{{ pki_ca_cert }}"
    status_code: [200, 401]
  delegate_to: localhost
  become: false
  register: gitlab_personal_token_check
  no_log: true

- name: Create the token {{ personal_token_name }} of {{ personal_token_user }}
  when: >-
    gitlab_personal_token_check.status != 200
    or gitlab_personal_token_check.json.username != personal_token_user
  block:
    # The token travels in a file readable by the git user only, not on the command line.
    - name: Hand the token value to the Rails runner
      ansible.builtin.copy:
        content: "{{ personal_token_value }}"
        dest: /run/code-keeper-token
        owner: git
        group: git
        mode: "0400"
      no_log: true

    - name: Create the token ({{ personal_token_scopes | join(', ') }}, {{ personal_token_days }} days)
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - >-
            user = User.find_by_username('{{ personal_token_user }}');
            user.personal_access_tokens.active.where(name: '{{ personal_token_name }}').each(&:revoke!);
            token = user.personal_access_tokens.create(scopes: {{ personal_token_scopes | to_json }}, name: '{{ personal_token_name }}', expires_at: {{ personal_token_days }}.days.from_now);
            token.set_token(File.read('/run/code-keeper-token').strip);
            token.save!
      changed_when: true

  always:
    - name: Remove the token file
      ansible.builtin.file:
        path: /run/code-keeper-token
        state: absent
