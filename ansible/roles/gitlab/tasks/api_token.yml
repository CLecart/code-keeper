# Ansible talks to the GitLab API with a personal access token of root whose
# value comes from the vault. It expires after 30 days and is recreated here
# whenever GitLab refuses it.
- name: Check the API token
  ansible.builtin.uri:
    url: "{{ gitlab_api_url }}/user"
    headers:
      PRIVATE-TOKEN: "{{ vault_gitlab_api_token }}"
    ca_path: "{{ pki_ca_cert }}"
    status_code: [200, 401]
  delegate_to: localhost
  become: false
  register: gitlab_api_user
  no_log: true

- name: Create the API token
  when: gitlab_api_user.status != 200
  block:
    # The token travels in a file readable by the git user only, not on the command line.
    - name: Hand the token value to the Rails runner
      ansible.builtin.copy:
        content: "{{ vault_gitlab_api_token }}"
        dest: /run/code-keeper-api-token
        owner: git
        group: git
        mode: "0400"
      no_log: true

    - name: Create the token for root (scopes api and create_runner, 30 days)
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - >-
            user = User.find_by_username('root');
            user.personal_access_tokens.active.where(name: 'ansible').each(&:revoke!);
            token = user.personal_access_tokens.create(scopes: ['api', 'create_runner'], name: 'ansible', expires_at: 30.days.from_now);
            token.set_token(File.read('/run/code-keeper-api-token').strip);
            token.save!
      changed_when: true

  always:
    - name: Remove the token file
      ansible.builtin.file:
        path: /run/code-keeper-api-token
        state: absent
