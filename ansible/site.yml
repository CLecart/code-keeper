# Deploys the GitLab instance and its runner on the two machines created by
# bootstrap/. Run from the ansible/ directory:
#   ansible-playbook site.yml
#   ansible-playbook site.yml --list-tasks

- name: Create the project certificate authority on the admin machine
  hosts: controller
  gather_facts: false
  roles:
    - pki

- name: Update the base system of both machines
  hosts: gitlab:runners
  become: true
  roles:
    - common

- name: Install and configure GitLab
  hosts: gitlab
  become: true
  roles:
    - gitlab

# Uses the AWS CLI credentials of the admin machine.
- name: Publish the OpenID configuration of GitLab for AWS
  hosts: controller
  gather_facts: false
  roles:
    - gitlab_oidc

# API calls only, run from the admin machine.
- name: Create the GitLab group, its members and the four projects
  hosts: controller
  gather_facts: false
  roles:
    - gitlab_projects

- name: Install and register the GitLab Runner
  hosts: runners
  become: true
  roles:
    - gitlab_runner
